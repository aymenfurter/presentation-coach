name: Backend Lint

permissions:
  contents: read

on:
  push:
    branches: [main, master]
    paths:
      - 'src/backend/**'
  pull_request:
    branches: [main, master]
    paths:
      - 'src/backend/**'

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install ruff
        run: pip install ruff

      - name: Run Python linter
        working-directory: src/backend
        run: ruff check src/ tests/
