name: Backend Tests

on:
  push:
    branches: [main, master]
    paths:
      - 'src/backend/**'
  pull_request:
    branches: [main, master]
    paths:
      - 'src/backend/**'

jobs:
  test:
    runs-on: ubuntu-latest
    
    env:
      AZURE_OPENAI_ENDPOINT: "https://test.openai.azure.com"
      CONTENT_UNDERSTANDING_ENDPOINT: "https://test.openai.azure.com"

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: src/backend/requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        working-directory: src/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov

      - name: Run tests with coverage
        working-directory: src/backend
        run: |
          python -m pytest tests/ -v --cov=src --cov-report=xml --cov-report=term-missing --cov-fail-under=60

      - name: Upload coverage reports
        uses: codecov/codecov-action@v5
        if: always()
        with:
          file: src/backend/coverage.xml
          flags: backend
          name: backend-coverage
        continue-on-error: true
